<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquer The World 非公式ウィキ</title>
    <link rel="icon" href="https://i.imgur.com/CcBLZ0O.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, query, orderBy, onSnapshot, addDoc, serverTimestamp, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWJ8gxMBqlCH-HGccXb-PpwM7xWVghUNg",
            authDomain: "my-ball-wiki.firebaseapp.com",
            projectId: "my-ball-wiki",
            storageBucket: "my-ball-wiki.firebasestorage.app",
            messagingSenderId: "1004863748430",
            appId: "1:1004863748430:web:584e16403e2eb87c90861f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const BANNED_KEYWORDS = ["暴力", "殺す", "死ね", "爆弾", "差別", "ヘイト", "犯罪", "グロ", "ガイジ"];
        const MAX_CONTENT_LENGTH = 10000;
        const MAX_COMMENT_LENGTH = 500;

        function processText(text) {
            if (!text) return "";
            let safeText = String(text);
            BANNED_KEYWORDS.forEach(word => {
                const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const reg = new RegExp(escapedWord, 'gi');
                safeText = safeText.replace(reg, '***');
            });
            safeText = safeText.replace(/>>([^\s　]+)/g, '<span style="color:var(--accent); font-weight:bold; cursor:pointer;">&gt;&gt;$1</span>');
            return safeText;
        }

        function isSafe(text) {
            const found = BANNED_KEYWORDS.find(word => text.includes(word));
            if (found) { alert(`不適切な表現が含まれています。`); return false; }
            return true;
        }

        window.wikiData = {};
        let commentUnsubscribe = null;
        let likeUnsubscribe = null;

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('header-clock');
            if(clockEl) {
                const p = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')];
                const t = [String(now.getHours()).padStart(2,'0'), String(now.getMinutes()).padStart(2,'0'), String(now.getSeconds()).padStart(2,'0')];
                clockEl.innerText = `${p.join('/')} ${t.join(':')}`;
            }
        }
        setInterval(updateClock, 1000);

        async function init() {
            updateClock();
            try {
                const snap = await getDocs(collection(db, "pages"));
                window.wikiData = {};
                const cats = new Set(["未分類"]);
                snap.forEach(d => {
                    const data = d.data();
                    window.wikiData[d.id] = data;
                    if(data.category) cats.add(data.category);
                });
                renderSidebar(cats);
                render();
            } catch (e) { console.error(e); }
        }

        function renderSidebar(cats) {
            const list = document.getElementById('menu-list');
            list.innerHTML = Array.from(cats).sort().map(c => {
                const pgs = Object.keys(window.wikiData).filter(id => (window.wikiData[id].category || "未分類") === c);
                return `<div class="menu-label">${processText(c)}</div><ul>${pgs.map(id => `<li><a href="#${encodeURIComponent(id)}">${processText(id)}</a></li>`).join('')}</ul>`;
            }).join('');
        }

        window.setReply = (targetId, name) => {
            const input = document.getElementById(targetId);
            input.value = `>>${name} ${input.value}`;
            input.focus();
        };

        window.deleteMsg = async (colPath, docId) => {
            const pass = prompt("投稿時のパスワードを入力してください：");
            if(!pass) return;
            try {
                const docRef = doc(db, colPath, docId);
                const snap = await getDoc(docRef);
                if(snap.exists() && snap.data().pass === pass) {
                    await deleteDoc(docRef);
                    alert("削除しました。");
                } else {
                    alert("パスワードが違います。");
                }
            } catch(e) { alert("エラーが発生しました。"); }
        };

        window.addLike = async () => {
            const hash = decodeURIComponent(location.hash.slice(1)).split('#')[0];
            if(!hash || hash === 'home' || hash === 'editor') return;
            const docRef = doc(db, "pages", hash);
            await updateDoc(docRef, { likes: increment(1) });
        };

        function watchLikes(pageId) {
            if(likeUnsubscribe) likeUnsubscribe();
            likeUnsubscribe = onSnapshot(doc(db, "pages", pageId), (s) => {
                const data = s.data();
                const count = data ? (data.likes || 0) : 0;
                const el = document.getElementById('like-count');
                if(el) el.innerText = count;
            });
        }

        onSnapshot(query(collection(db, "global_chat"), orderBy("createdAt", "asc")), (s) => {
            const chatList = document.getElementById('chat-list');
            if(!chatList) return;
            chatList.innerHTML = s.docs.slice(-30).map(d => {
                const data = d.data();
                const u = data.user || "名無し";
                return `<div class="msg" style="display:flex; justify-content:space-between; align-items:start;">
                    <div onclick="setReply('c-t', '${u}')" style="cursor:pointer; flex:1;">
                        <b style="color:var(--accent);">${processText(u)}:</b> ${processText(data.text)}
                    </div>
                    <button class="del-btn" onclick="deleteMsg('global_chat', '${d.id}')">×</button>
                </div>`;
            }).join('');
            chatList.scrollTop = chatList.scrollHeight;
        });

        window.sendChat = async () => {
            const u = document.getElementById('c-u').value || "名無し";
            const p = document.getElementById('c-p').value;
            const t = document.getElementById('c-t');
            if(!t.value.trim()) return;
            if(!p) return alert("削除用パスワードを設定してください。");
            if(!isSafe(u) || !isSafe(t.value)) return;
            await addDoc(collection(db, "global_chat"), { user: u, text: t.value, pass: p, createdAt: serverTimestamp() });
            t.value = "";
        };

        window.sendComment = async () => {
            const hash = decodeURIComponent(location.hash.slice(1)).split('#')[0] || 'home';
            const u = document.getElementById('comment-user').value || "名無し";
            const p = document.getElementById('comment-pass').value;
            const t = document.getElementById('comment-text');
            if(!t.value.trim()) return;
            if(!p) return alert("削除用パスワードを設定してください。");
            if(t.value.length > MAX_COMMENT_LENGTH) return alert("文字数制限オーバー");
            if(!isSafe(u) || !isSafe(t.value)) return;

            await addDoc(collection(db, "pages", hash, "comments"), {
                user: u, text: t.value, pass: p, createdAt: serverTimestamp()
            });
            t.value = "";
        };

        function watchComments(pageId) {
            if (commentUnsubscribe) commentUnsubscribe();
            const colPath = `pages/${pageId}/comments`;
            const q = query(collection(db, colPath), orderBy("createdAt", "desc"));
            commentUnsubscribe = onSnapshot(q, (s) => {
                const list = document.getElementById('page-comments-list');
                if(!list) return;
                list.innerHTML = s.docs.map(d => {
                    const data = d.data();
                    const u = data.user || "名無し";
                    const date = data.createdAt ? data.createdAt.toDate().toLocaleString() : "...";
                    return `<div class="comment-item">
                        <div class="comment-meta">
                            <span onclick="setReply('comment-text', '${u}')" style="cursor:pointer;"><b>${processText(u)}</b> <span>${date}</span></span>
                            <button class="del-btn" onclick="deleteMsg('${colPath}', '${d.id}')">削除</button>
                        </div>
                        <div class="comment-content">${processText(data.text)}</div>
                    </div>`;
                }).join('') || '<p style="color:#666; font-size:0.8rem;">まだコメントはありません。</p>';
            });
        }

        window.insertImage = () => {
            const url = prompt("画像のURLを入力してください：");
            if(!url) return;
            const textarea = document.getElementById('e-ct');
            const pos = textarea.selectionStart;
            const text = textarea.value;
            textarea.value = text.substring(0, pos) + `\n![](${url})\n` + text.substring(textarea.selectionEnd);
            textarea.focus();
        };

        window.searchWiki = () => {
            const q = document.getElementById('wiki-search').value.toLowerCase().trim();
            if(!q) return render();
            const results = Object.keys(window.wikiData).filter(id => id.toLowerCase().includes(q) || (window.wikiData[id].content || "").toLowerCase().includes(q));
            document.getElementById('page-title').innerText = `検索結果: ${q}`;
            document.getElementById('wiki-view').innerHTML = results.length > 0 ? `<ul>${results.map(id => `<li><a href="#${encodeURIComponent(id)}">${processText(id)}</a></li>`).join('')}</ul>` : `<p>該当なし</p>`;
        };

        function render() {
            const hash = decodeURIComponent(location.hash.slice(1)).split('#')[0] || 'home';
            const isEd = hash === 'editor';
            document.getElementById('display-area').style.display = isEd ? 'none' : 'flex';
            document.getElementById('editor-area').style.display = isEd ? 'block' : 'none';
            if (isEd) return;

            const commentSection = document.getElementById('page-comment-section');
            const likeContainer = document.getElementById('like-container');

            if (hash === 'home') {
                document.getElementById('page-title').innerText = "TOP PAGE";
                document.getElementById('wiki-view').innerHTML = document.getElementById('home-content').innerHTML;
                document.getElementById('toc-box').style.display = 'none';
                commentSection.style.display = 'none';
                likeContainer.style.display = 'none';
            } else {
                const data = window.wikiData[hash] || { content: "# 404\nNot Found", category: "未分類", likes: 0 };
                document.getElementById('page-title').innerText = processText(hash);
                const rawHTML = marked.parse(data.content || "");
                document.getElementById('wiki-view').innerHTML = processText(rawHTML);
                
                document.getElementById('e-id').value = hash;
                document.getElementById('e-ct').value = data.content || "";
                document.getElementById('e-ca').value = data.category || "未分類";
                
                generateTOC();
                commentSection.style.display = 'block';
                likeContainer.style.display = 'flex';
                watchComments(hash);
                watchLikes(hash);
            }
            window.scrollTo(0,0);
        }

        function generateTOC() {
            const h2s = document.getElementById('wiki-view').querySelectorAll('h2');
            const list = document.getElementById('toc-list');
            list.innerHTML = "";
            if(h2s.length === 0) { document.getElementById('toc-box').style.display = 'none'; return; }
            document.getElementById('toc-box').style.display = 'block';
            h2s.forEach((h, i) => {
                h.id = "s"+i;
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${location.hash.slice(1)}#s${i}">${h.innerText}</a>`;
                li.onclick = (e) => { e.preventDefault(); h.scrollIntoView({behavior: "smooth"}); };
                list.appendChild(li);
            });
        }

        window.savePage = async () => {
            const id = document.getElementById('e-id').value.trim();
            const content = document.getElementById('e-ct').value;
            const category = document.getElementById('e-ca').value;
            if(!id) return alert("Title required");
            if(content.length > MAX_CONTENT_LENGTH) return alert("文字数制限オーバー");
            if(!isSafe(id) || !isSafe(content) || !isSafe(category)) return;
            
            const docRef = doc(db, "pages", id);
            const snap = await getDoc(docRef);
            const currentLikes = snap.exists() ? (snap.data().likes || 0) : 0;

            await setDoc(docRef, { 
                content: content, 
                category: category || "未分類", 
                updatedAt: serverTimestamp(),
                likes: currentLikes 
            });
            location.hash = `#${encodeURIComponent(id)}`;
            location.reload();
        };

        window.onhashchange = render;
        init();
    </script>

    <style>
        :root { --bg: #0d0d0d; --side: rgba(22, 22, 22, 0.9); --border: #2a2a2a; --accent: #4d97ff; --text: #d0d0d0; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans JP', sans-serif; color: var(--text); display: flex; flex-direction: column; min-height: 100vh; background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://i.imgur.com/j2wlBo1.png'); background-size: cover; background-position: center; background-attachment: fixed; background-color: var(--bg); }
        header { height: 50px; background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid var(--accent); display: flex; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 100; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .header-left a { color: #fff; text-decoration: none; }
        #header-clock { font-family: monospace; color: var(--accent); font-size: 0.8rem; }
        #main-container { display: flex; flex: 1; }
        aside#left-sidebar { background: var(--side); border-right: 1px solid var(--border); padding: 20px; flex-shrink: 0; width: 240px; height: calc(100vh - 50px); overflow-y: auto; position: sticky; top: 50px; }
        .search-box input { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 4px; outline: none; margin-bottom: 15px; }
        main { flex: 1; min-width: 0; }
        #content-body { padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        #display-area { display: flex; gap: 20px; align-items: flex-start; }
        article#wiki-card { flex: 1; background: rgba(15, 15, 15, 0.85); border: 1px solid var(--border); padding: 25px; border-radius: 8px; backdrop-filter: blur(5px); min-width: 0; }
        
        .title-wrapper { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        #page-title { font-size: 1.7rem; font-weight: bold; color: #fff; margin: 0; }
        .like-btn { background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; color: #ff4d4d; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .like-btn:hover { background: #ff4d4d; color: #fff; }

        aside#right-sidebar { width: 300px; flex-shrink: 0; position: sticky; top: 70px; }
        .widget { background: var(--side); border: 1px solid var(--border); padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .widget-title { font-size: 0.7rem; font-weight: bold; color: #888; border-bottom: 1px solid #333; margin-bottom: 10px; padding-bottom: 5px; text-transform: uppercase; }
        #chat-list { height: 350px; overflow-y: auto; font-size: 0.8rem; border-bottom: 1px solid #333; margin-bottom: 10px; }
        .msg { margin-bottom: 8px; word-break: break-all; padding: 4px; border-radius: 4px; }
        .chat-input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; font-size: 0.85rem; border-radius: 4px; outline: none; margin-bottom: 5px; }
        .del-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.7rem; padding: 2px 5px; }
        
        #page-comment-section { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); }
        .comment-item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
        .comment-meta { font-size: 0.75rem; color: #888; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }

        .menu-label { background: rgba(255,255,255,0.05); padding: 5px 10px; margin: 15px 0 5px; border-left: 3px solid var(--accent); font-size: 0.8rem; font-weight: bold; }
        aside ul { list-style: none; padding: 0; margin: 0 0 0 10px; font-size: 0.85rem; }
        aside a { color: var(--accent); text-decoration: none; display: block; padding: 4px 0; }
        
        #editor-area { display: none; background: rgba(15, 15, 15, 0.95); padding: 25px; border-radius: 8px; }
        #editor-tools { margin-bottom: 10px; display: flex; gap: 10px; }
        #e-ct { width: 100%; height: 60vh; background: #000; color: #fff; border: 1px solid var(--border); padding: 15px; margin-top: 10px; font-family: monospace; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .tool-btn { background: #333; color: #eee; padding: 5px 10px; font-size: 0.8rem; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
        
        .fab { position: fixed; bottom: 25px; right: 25px; background: var(--accent); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 28px; z-index: 1000; }

        /* ホーム用追加スタイル */
        .home-section { margin-bottom: 30px; }
        .home-h3 { color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; font-size: 1.2rem; }
        .rule-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="https://i.imgur.com/CcBLZ0O.png" style="width:28px; height:28px; border-radius:4px;">
        <a href="#home">Conquer The World 非公式ウィキ</a>
    </div>
    <div id="header-clock">0000/00/00 00:00:00</div>
</header>

<div id="main-container">
    <aside id="left-sidebar">
        <div class="search-box"><input type="text" id="wiki-search" placeholder="ページ検索..." oninput="searchWiki()"></div>
        <div class="menu-label">MENU</div>
        <ul>
            <li><a href="#home">🏠 トップページ</a></li>
            <li><a href="#editor">📝 ページ作成</a></li>
        </ul>
        <div id="menu-list"></div>
        <div style="margin-top:30px; padding:15px; border-top:1px solid var(--border); font-size:0.7rem; color:#666;">
            <b>ADMIN</b><br>
            <a href="https://discord.com/users/1424679085396725770" target="_blank" style="color:var(--accent); text-decoration:none;">Discord: @mikancat10</a>
        </div>
    </aside>

    <main>
        <div id="content-body">
            <div id="display-area">
                <article id="wiki-card">
                    <div class="title-wrapper">
                        <div id="page-title">Loading...</div>
                        <div id="like-container" style="display:none; align-items:center; gap:10px;">
                            <button class="like-btn" onclick="addLike()">❤ いいね <span id="like-count">0</span></button>
                        </div>
                    </div>
                    <div id="wiki-view"></div>

                    <section id="page-comment-section" style="display:none;">
                        <h3 style="color:#fff; font-size:1.2rem; margin-bottom:20px;">コメント</h3>
                        <div style="margin-bottom:25px; background:rgba(0,0,0,0.3); padding:15px; border-radius:8px;">
                            <div style="display:flex; gap:10px; margin-bottom:10px;">
                                <input type="text" id="comment-user" class="chat-input" placeholder="名前" style="flex:1;">
                                <input type="password" id="comment-pass" class="chat-input" placeholder="削除パスワード" style="flex:1;">
                            </div>
                            <textarea id="comment-text" class="chat-input" placeholder="コメントを入力（500文字以内）" style="height:80px; resize:none;"></textarea>
                            <button class="btn" style="margin-top:10px; width:100%;" onclick="sendComment()">コメントを投稿</button>
                        </div>
                        <div id="page-comments-list"></div>
                    </section>
                </article>

                <aside id="right-sidebar">
                    <div class="widget">
                        <div class="widget-title">GLOBAL CHAT</div>
                        <div id="chat-list"></div>
                        <div style="display:flex; gap:5px; margin-bottom:5px;">
                            <input type="text" id="c-u" class="chat-input" placeholder="名前" style="flex:1;">
                            <input type="password" id="c-p" class="chat-input" placeholder="削除パス" style="flex:1;">
                        </div>
                        <input type="text" id="c-t" class="chat-input" placeholder="メッセージ..." onkeydown="if(event.key==='Enter') sendChat()">
                    </div>
                    <div class="widget" id="toc-box">
                        <div class="widget-title">CONTENTS</div>
                        <ul id="toc-list" style="list-style:none; padding:0; font-size:0.8rem;"></ul>
                    </div>
                </aside>
            </div>

            <section id="editor-area">
                <h2 style="color:#fff; margin-top:0;">EDIT PAGE</h2>
                <div id="editor-tools">
                    <button class="tool-btn" onclick="insertImage()">📷 画像挿入</button>
                    <span style="font-size:0.7rem; color:#666;">URLを貼るだけで画像が表示されます</span>
                </div>
                <input type="text" id="e-id" placeholder="ページ名" class="chat-input" style="height:45px; font-size:1rem;">
                <input type="text" id="e-ca" placeholder="カテゴリー" class="chat-input">
                <textarea id="e-ct" placeholder="Markdown形式..."></textarea>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn" onclick="savePage()">💾 保存</button>
                    <button class="btn" style="background:#444;" onclick="location.hash='#home'">キャンセル</button>
                </div>
            </section>
        </div>
    </main>
</div>

<a href="#editor" class="fab">+</a>

<script id="home-content" type="text/template">
    <div class="home-section">
        <p>Conquer The World (CTW) 非公式ウィキへようこそ！<br>
        このサイトは、プレイヤー全員で作り上げる攻略・情報共有プラットフォームです。</p>
    </div>

    <div class="home-section">
        <h3 class="home-h3">✨ 最新のアップデート</h3>
        <div style="background: rgba(77, 151, 255, 0.1); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent);">
            <ul style="margin: 0; padding-left: 20px; line-height: 1.8;">
                <li><b>❤ いいね機能</b>: 良いと思ったページには「いいね」を送って応援しましょう！</li>
                <li><b>📷 画像投稿</b>: エディタの「画像挿入」ボタンから、簡単に画像を埋め込めるようになりました。</li>
                <li><b>💬 返信機能</b>: チャットやコメントの発言をクリックして返信ができます。</li>
            </ul>
        </div>
    </div>

    <div class="home-section">
        <h3 class="home-h3">📌 基本ルール</h3>
        <div class="rule-card">
            <ul style="margin: 0; padding-left: 20px; line-height: 1.8;">
                <li><b>自由な編集</b>: 誰でも新しいページの作成や編集が可能です。</li>
                <li><b>マナーの遵守</b>: 荒らし行為、誹謗中傷、他者を不快にさせる表現は厳禁です。</li>
                <li><b>文字数制限</b>: 1ページ最大10,000文字、1コメント最大500文字です。</li>
            </ul>
