<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquer The World 非公式ウィキ</title>
    <link rel="icon" href="https://i.imgur.com/CcBLZ0O.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, query, orderBy, onSnapshot, addDoc, serverTimestamp, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWJ8gxMBqlCH-HGccXb-PpwM7xWVghUNg",
            authDomain: "my-ball-wiki.firebaseapp.com",
            projectId: "my-ball-wiki",
            storageBucket: "my-ball-wiki.firebasestorage.app",
            messagingSenderId: "1004863748430",
            appId: "1:1004863748430:web:584e16403e2eb87c90861f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const BANNED_KEYWORDS = ["暴力", "殺す", "死ね", "爆弾", "差別", "ヘイト", "犯罪", "グロ", "ガイジ"];
        const MAX_CONTENT_LENGTH = 10000;
        const MAX_COMMENT_LENGTH = 500;

        let currentUser = null;

        window.login = async () => {
            try { await signInWithPopup(auth, provider); } catch (e) { alert("ログインに失敗しました。"); }
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const loginBtn = document.getElementById('login-btn');
            const userArea = document.getElementById('user-info');
            if (user) {
                loginBtn.style.display = 'none';
                userArea.style.display = 'flex';
                userArea.innerHTML = `<img src="${user.photoURL}" style="width:24px;height:24px;border-radius:50%;"><span style="font-size:0.8rem;cursor:pointer;color:var(--accent);border-bottom:1px solid;" onclick="logout()">Logout</span>`;
                if(document.getElementById('c-u')) { document.getElementById('c-u').value = user.displayName; document.getElementById('c-u').readOnly = true; }
                if(document.getElementById('comment-user')) { document.getElementById('comment-user').value = user.displayName; document.getElementById('comment-user').readOnly = true; }
            } else {
                loginBtn.style.display = 'block';
                userArea.style.display = 'none';
                if(document.getElementById('c-u')) document.getElementById('c-u').readOnly = false;
                if(document.getElementById('comment-user')) document.getElementById('comment-user').readOnly = false;
            }
        });

        // 修正された processText 関数
        function processText(text, isHTML = false) {
            if (!text) return "";
            let safeText = String(text);

            // 1. NGワード置換（URLの中身も含めて一旦置換）
            BANNED_KEYWORDS.forEach(word => {
                const reg = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                safeText = safeText.replace(reg, '***');
            });

            if (isHTML) {
                // 2. 既にタグになっている <img src="..."> や <a href="..."> のURLをリンク化から除外する
                // 属性値以外の場所にあるURLだけを <a> タグにする
                const urlRegex = /(?<!src=["']|href=["'])(https?:\/\/[^\s<>"]+)/g;
                safeText = safeText.replace(urlRegex, '<a href="$1" target="_blank" style="color:var(--accent);text-decoration:underline;">$1</a>');
            } else {
                // プレーンテキスト（チャット等）の場合は単純にリンク化
                safeText = safeText.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--accent);text-decoration:underline;">$1</a>');
            }

            // アンカー（>>レスポンス）の処理
            safeText = safeText.replace(/>>([^\s　]+)/g, '<span style="color:var(--accent); font-weight:bold; cursor:pointer;">&gt;&gt;$1</span>');
            return safeText;
        }

        function isSafe(text) {
            if (BANNED_KEYWORDS.some(word => text.includes(word))) { alert(`不適切な表現が含まれています。`); return false; }
            return true;
        }

        window.wikiData = {};
        let commentUnsubscribe = null;
        let likeUnsubscribe = null;

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('header-clock');
            if(clockEl) {
                clockEl.innerText = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            }
        }
        setInterval(updateClock, 1000);

        async function init() {
            updateClock();
            onSnapshot(collection(db, "pages"), (snap) => {
                window.wikiData = {};
                const cats = new Set(["未分類"]);
                snap.forEach(d => {
                    const data = d.data();
                    window.wikiData[d.id] = data;
                    if(data.category) cats.add(data.category);
                });
                renderSidebar(cats);
                render();
            });
        }

        function renderSidebar(cats) {
            const list = document.getElementById('menu-list');
            list.innerHTML = Array.from(cats).sort().map(c => {
                const pgs = Object.keys(window.wikiData).filter(id => (window.wikiData[id].category || "未分類") === c);
                if(pgs.length === 0) return "";
                return `<div class="menu-label">${processText(c)}</div><ul>${pgs.map(id => `<li><a href="#${encodeURIComponent(id)}">${processText(id)}</a></li>`).join('')}</ul>`;
            }).join('');
        }

        window.setReply = (targetId, name) => {
            const input = document.getElementById(targetId);
            input.value = `>>${name} ${input.value}`;
            input.focus();
        };

        window.deleteMsg = async (colPath, docId) => {
            const pass = prompt("投稿時のパスワードを入力してください：");
            if(!pass) return;
            try {
                const docRef = doc(db, colPath, docId);
                const snap = await getDoc(docRef);
                if(snap.exists() && snap.data().pass === pass) { await deleteDoc(docRef); alert("削除しました。"); }
                else { alert("パスワードが違います。"); }
            } catch(e) { alert("エラーが発生しました。"); }
        };

        window.addLike = async () => {
            const hash = decodeURIComponent(location.hash.slice(1)).split('#')[0];
            if(!hash || hash === 'home' || hash === 'editor') return;
            await updateDoc(doc(db, "pages", hash), { likes: increment(1) });
        };

        function watchLikes(pageId) {
            if(likeUnsubscribe) likeUnsubscribe();
            likeUnsubscribe = onSnapshot(doc(db, "pages", pageId), (s) => {
                const data = s.data();
                const el = document.getElementById('like-count');
                if(el) el.innerText = data ? (data.likes || 0) : 0;
            });
        }

        onSnapshot(query(collection(db, "global_chat"), orderBy("createdAt", "asc")), (s) => {
            const chatList = document.getElementById('chat-list');
            if(!chatList) return;
            chatList.innerHTML = s.docs.slice(-30).map(d => {
                const data = d.data();
                const u = data.user || "名無し";
                const time = data.createdAt ? data.createdAt.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
                return `<div class="msg" style="display:flex; justify-content:space-between; align-items:start;">
                    <div onclick="setReply('c-t', '${u}')" style="cursor:pointer; flex:1;">
                        <b style="color:var(--accent);">${processText(u)}</b> <small style="color:#555;font-size:0.7rem;">${time}</small><br>${processText(data.text)}
                    </div>
                    <button class="del-btn" onclick="deleteMsg('global_chat', '${d.id}')">×</button>
                </div>`;
            }).join('');
            chatList.scrollTop = chatList.scrollHeight;
        });

        window.sendChat = async () => {
            const u = document.getElementById('c-u').value || "名無し";
            const p = document.getElementById('c-p').value;
            const t = document.getElementById('c-t');
            if(!t.value.trim() || !p || !isSafe(u) || !isSafe(t.value)) return;
            await addDoc(collection(db, "global_chat"), { user: u, text: t.value, pass: p, createdAt: serverTimestamp(), uid: currentUser ? currentUser.uid : null });
            t.value = "";
        };

        window.sendComment = async () => {
            const hash = decodeURIComponent(location.hash.slice(1)).split('#')[0] || 'home';
            const u = document.getElementById('comment-user').value || "名無し";
            const p = document.getElementById('comment-pass').value;
            const t = document.getElementById('comment-text');
            if(!t.value.trim() || !p || t.value.length > MAX_COMMENT_LENGTH || !isSafe(u) || !isSafe(t.value)) return;
            await addDoc(collection(db, "pages", hash, "comments"), { user: u, text: t.value, pass: p, createdAt: serverTimestamp(), uid: currentUser ? currentUser.uid : null });
            t.value = "";
        };

        function watchComments(pageId) {
            if (commentUnsubscribe) commentUnsubscribe();
            const colPath = `pages/${pageId}/comments`;
            commentUnsubscribe = onSnapshot(query(collection(db, colPath), orderBy("createdAt", "desc")), (s) => {
                const list = document.getElementById('page-comments-list');
                if(!list) return;
                list.innerHTML = s.docs.map(d => {
                    const data = d.data();
                    const u = data.user || "名無し";
                    const date = data.createdAt ? data.createdAt.toDate().toLocaleString([], {year:'numeric', month:'2-digit', day:'2-digit', hour: '2-digit', minute:'2-digit'}) : "...";
                    return `<div class="comment-item">
                        <div class="comment-meta">
                            <span onclick="setReply('comment-text', '${u}')" style="cursor:pointer;"><b>${processText(u)}</b> <span style="margin-left:8px; opacity:0.7;">${date}</span></span>
                            <button class="del-btn" onclick="deleteMsg('${colPath}', '${d.id}')">削除</button>
                        </div>
                        <div class="comment-content">${processText(data.text)}</div>
                    </div>`;
                }).join('') || '<p style="color:#666; font-size:0.8rem;">まだコメントはありません。</p>';
            });
        }

        window.insertImage = () => {
            const url = prompt("画像のURLを入力してください：");
            if(!url) return;
            const textarea = document.getElementById('e-ct');
            const pos = textarea.selectionStart;
            textarea.value = textarea.value.substring(0, pos) + `\n![](${url})\n` + textarea.value.substring(textarea.selectionEnd);
            textarea.focus();
            document.getElementById('char-count').innerText = `${textarea.value.length} / ${MAX_CONTENT_LENGTH} 文字`;
        };

        window.searchWiki = () => {
            const q = document.getElementById('wiki-search').value.toLowerCase().trim();
            if(!q) return render();
            const results = Object.keys(window.wikiData).filter(id => id.toLowerCase().includes(q) || (window.wikiData[id].content || "").toLowerCase().includes(q));
            document.getElementById('page-title').innerText = `検索結果: ${q}`;
            document.getElementById('wiki-view').innerHTML = results.length > 0 ? `<ul class="wiki-list">${results.map(id => `<li><a href="#${encodeURIComponent(id)}">${processText(id)}</a></li>`).join('')}</ul>` : `<p>該当なし</p>`;
        };

        window.openEditor = (pageId = "") => {
            if (pageId === "home") return alert("トップページは編集できません。");
            location.hash = pageId ? `#editor#${encodeURIComponent(pageId)}` : "#editor";
        };

        function render() {
            const hashFull = decodeURIComponent(location.hash.slice(1));
            const [mode, targetId] = hashFull.split('#');
            const isEd = mode === 'editor';
            document.getElementById('display-area').style.display = isEd ? 'none' : 'flex';
            document.getElementById('editor-area').style.display = isEd ? 'block' : 'none';
            
            if (isEd) {
                const textarea = document.getElementById('e-ct');
                if(targetId && window.wikiData[targetId]) {
                    const d = window.wikiData[targetId];
                    document.getElementById('e-id').value = targetId;
                    document.getElementById('e-id').readOnly = true;
                    textarea.value = d.content || "";
                    document.getElementById('e-ca').value = d.category || "未分類";
                    document.getElementById('e-shared').value = d.editors ? d.editors.join(', ') : "";
                } else {
                    document.getElementById('e-id').value = ""; document.getElementById('e-id').readOnly = false;
                    textarea.value = ""; document.getElementById('e-ca').value = ""; document.getElementById('e-shared').value = "";
                }
                document.getElementById('char-count').innerText = `${textarea.value.length} / ${MAX_CONTENT_LENGTH} 文字`;
                textarea.oninput = function() { document.getElementById('char-count').innerText = `${this.value.length} / ${MAX_CONTENT_LENGTH} 文字`; };
                return;
            }

            const hash = mode || 'home';
            const view = document.getElementById('wiki-view');
            const title = document.getElementById('page-title');

            if (hash === 'home') {
                title.innerText = "記事一覧";
                const pgs = Object.keys(window.wikiData);
                view.innerHTML = `<ul class="wiki-list">${pgs.map(id => `<li><a href="#${encodeURIComponent(id)}">${processText(id)}</a></li>`).join('')}</ul>`;
                document.getElementById('toc-box').style.display = 'none';
                document.getElementById('page-comment-section').style.display = 'none';
                document.getElementById('like-container').style.display = 'none';
                document.getElementById('edit-page-btn').style.display = 'none';
            } else {
                const data = window.wikiData[hash] || { content: "# 404\nNot Found", category: "未分類", likes: 0 };
                title.innerText = processText(hash);
                const rawHTML = marked.parse(data.content || "");
                // HTMLに変換した後に、URLがタグの属性値（src, href）以外にある場合のみリンク化するように修正
                view.innerHTML = processText(rawHTML, true);
                generateTOC();
                document.getElementById('page-comment-section').style.display = 'block';
                document.getElementById('like-container').style.display = 'flex';
                document.getElementById('edit-page-btn').style.display = 'block';
                document.getElementById('edit-page-btn').onclick = () => openEditor(hash);
                watchComments(hash);
                watchLikes(hash);
            }
            window.scrollTo(0,0);
        }

        function generateTOC() {
            const h2s = document.getElementById('wiki-view').querySelectorAll('h2');
            const list = document.getElementById('toc-list');
            list.innerHTML = "";
            if(h2s.length === 0) { document.getElementById('toc-box').style.display = 'none'; return; }
            document.getElementById('toc-box').style.display = 'block';
            h2s.forEach((h, i) => {
                h.id = "s"+i;
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${location.hash.slice(1)}#s${i}">${h.innerText}</a>`;
                li.onclick = (e) => { e.preventDefault(); h.scrollIntoView({behavior: "smooth"}); };
                list.appendChild(li);
            });
        }

        window.savePage = async () => {
            const id = document.getElementById('e-id').value.trim();
            const content = document.getElementById('e-ct').value;
            const category = document.getElementById('e-ca').value;
            const pass = document.getElementById('e-pass').value;
            const editors = document.getElementById('e-shared').value.split(',').map(s => s.trim()).filter(s => s);

            if(!id || id.toLowerCase() === "home" || content.length > MAX_CONTENT_LENGTH || !isSafe(id) || !isSafe(content) || !isSafe(category)) return;
            
            const docRef = doc(db, "pages", id);
            const snap = await getDoc(docRef);
            
            const isAuthorized = snap.exists() && (
                (snap.data().pass && snap.data().pass === pass) || 
                (currentUser && snap.data().editors && snap.data().editors.includes(currentUser.email))
            );

            if (snap.exists() && !isAuthorized) return alert("編集権限がありません。");

            await setDoc(docRef, { 
                content, category: category || "未分類", pass, editors, 
                updatedAt: serverTimestamp(), likes: snap.exists() ? (snap.data().likes || 0) : 0,
                lastEditor: currentUser ? currentUser.displayName : "Anonymous"
            }, { merge: true });
            alert("保存しました！"); location.hash = `#${encodeURIComponent(id)}`; location.reload();
        };

        window.onhashchange = render;
        init();
    </script>

    <style>
        :root { --bg: #0d0d0d; --side: rgba(22, 22, 22, 0.9); --border: #2a2a2a; --accent: #4d97ff; --text: #d0d0d0; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans JP', sans-serif; color: var(--text); display: flex; flex-direction: column; min-height: 100vh; background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://i.imgur.com/j2wlBo1.png'); background-size: cover; background-position: center; background-attachment: fixed; background-color: var(--bg); }
        
        header { height: 50px; background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid var(--accent); display: flex; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 100; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 10px; font-weight: bold; flex-shrink: 0; }
        .header-left a { color: #fff; text-decoration: none; }
        
        .header-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
        #header-clock { font-family: monospace; color: var(--accent); font-size: 0.85rem; white-space: nowrap; }
        #user-info { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        #login-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; white-space: nowrap; }
        #login-btn:hover { background: rgba(77, 151, 255, 0.1); }

        #main-container { display: flex; flex: 1; }
        aside#left-sidebar { background: var(--side); border-right: 1px solid var(--border); padding: 20px; flex-shrink: 0; width: 240px; height: calc(100vh - 50px); overflow-y: auto; position: sticky; top: 50px; }
        .search-box input { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 4px; outline: none; margin-bottom: 15px; }
        main { flex: 1; min-width: 0; }
        #content-body { padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        #display-area { display: flex; gap: 20px; align-items: flex-start; }
        article#wiki-card { flex: 1; background: rgba(15, 15, 15, 0.85); border: 1px solid var(--border); padding: 25px; border-radius: 8px; backdrop-filter: blur(5px); min-width: 0; }
        .title-wrapper { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        #page-title { font-size: 1.7rem; font-weight: bold; color: #fff; margin: 0; }
        
        .wiki-list { list-style: none; padding: 0; }
        .wiki-list li { border-bottom: 1px solid var(--border); }
        .wiki-list a { color: var(--accent); text-decoration: none; display: block; padding: 10px; transition: 0.2s; }
        .wiki-list a:hover { background: rgba(77, 151, 255, 0.1); padding-left: 15px; }

        .like-btn { background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; color: #ff4d4d; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        
        /* Wiki内の画像表示設定 */
#wiki-view img {
    border: 2px solid red !important;
    min-height: 50px;
    min-width: 50px;
}        
        #wiki-view table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.9rem; background: rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; }
        #wiki-view th { background: rgba(77, 151, 255, 0.2); color: var(--accent); padding: 12px; text-align: left; border-bottom: 2px solid var(--accent); }
        #wiki-view td { border-bottom: 1px solid var(--border); padding: 10px; color: #ccc; text-align: center; }
        aside#right-sidebar { width: 300px; flex-shrink: 0; position: sticky; top: 70px; }
        .widget { background: var(--side); border: 1px solid var(--border); padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .widget-title { font-size: 0.7rem; font-weight: bold; color: #888; border-bottom: 1px solid #333; margin-bottom: 10px; padding-bottom: 5px; text-transform: uppercase; }
        #chat-list { height: 350px; overflow-y: auto; font-size: 0.8rem; border-bottom: 1px solid #333; margin-bottom: 10px; }
        .msg { margin-bottom: 8px; word-break: break-all; padding: 4px; border-radius: 4px; }
        .chat-input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; font-size: 0.85rem; border-radius: 4px; outline: none; margin-bottom: 5px; }
        .del-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.7rem; padding: 2px 5px; }
        .menu-label { background: rgba(255,255,255,0.05); padding: 5px 10px; margin: 15px 0 5px; border-left: 3px solid var(--accent); font-size: 0.8rem; font-weight: bold; }
        aside ul { list-style: none; padding: 0; margin: 0 0 0 10px; font-size: 0.85rem; }
        aside a { color: var(--accent); text-decoration: none; display: block; padding: 4px 0; }
        #editor-area { background: rgba(15, 15, 15, 0.95); padding: 25px; border-radius: 8px; display: none; }
        #e-ct { width: 100%; height: 60vh; background: #000; color: #fff; border: 1px solid var(--border); padding: 15px; margin-top: 10px; font-family: monospace; resize: vertical; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-small { padding: 5px 12px; font-size: 0.8rem; background: #333; }
        .fab { position: fixed; bottom: 25px; right: 25px; background: var(--accent); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 28px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        @media (max-width: 1100px) { #display-area { flex-direction: column; } aside#right-sidebar { width: 100%; position: static; } }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <img src="https://i.imgur.com/CcBLZ0O.png" style="width:28px; height:28px; border-radius:4px;">
        <a href="#home">Conquer The World 非公式ウィキ</a>
    </div>
    <div class="header-right">
        <div id="auth-area">
            <button id="login-btn" onclick="login()">Login with Google</button>
            <div id="user-info" style="display:none;"></div>
        </div>
        <div id="header-clock">0000/00/00 00:00:00</div>
    </div>
</header>
<div id="main-container">
    <aside id="left-sidebar">
        <div class="search-box"><input type="text" id="wiki-search" placeholder="ページ検索..." oninput="searchWiki()"></div>
        <div class="menu-label">MENU</div>
        <ul><li><a href="#home">🏠 トップページ</a></li><li><a href="javascript:openEditor()">📝 ページ作成</a></li></ul>
        <div id="menu-list"></div>
    </aside>
    <main>
        <div id="content-body">
            <div id="display-area">
                <article id="wiki-card">
                    <div class="title-wrapper"><div id="page-title">Loading...</div><div style="display:flex; align-items:center; gap:10px;"><button id="edit-page-btn" class="btn btn-small" style="display:none;">📝 編集</button><div id="like-container" style="display:none; align-items:center; gap:10px;"><button class="like-btn" onclick="addLike()">❤ <span id="like-count">0</span></button></div></div></div>
                    <div id="wiki-view"></div>
                    <section id="page-comment-section" style="display:none;">
                        <h3 style="color:#fff; font-size:1.2rem; margin-bottom:20px;">コメント</h3>
                        <div style="margin-bottom:25px; background:rgba(0,0,0,0.3); padding:15px; border-radius:8px;">
                            <div style="display:flex; gap:10px; margin-bottom:10px;"><input type="text" id="comment-user" class="chat-input" placeholder="名前" style="flex:1;"><input type="password" id="comment-pass" class="chat-input" placeholder="削除パスワード" style="flex:1;"></div>
                            <textarea id="comment-text" class="chat-input" placeholder="コメントを入力" style="height:80px; resize:none;"></textarea>
                            <button class="btn" style="width:100%;" onclick="sendComment()">投稿</button>
                        </div>
                        <div id="page-comments-list"></div>
                    </section>
                </article>
                <aside id="right-sidebar">
                    <div class="widget"><div class="widget-title">GLOBAL CHAT</div><div id="chat-list"></div><div style="display:flex; gap:5px;"><input type="text" id="c-u" class="chat-input" placeholder="名前" style="flex:1;"><input type="password" id="c-p" class="chat-input" placeholder="パス" style="flex:1;"></div><input type="text" id="c-t" class="chat-input" placeholder="メッセージ..." onkeydown="if(event.key==='Enter') sendChat()"></div>
                    <div class="widget" id="toc-box"><div class="widget-title">CONTENTS</div><ul id="toc-list" style="list-style:none; padding:0; font-size:0.8rem;"></ul></div>
                </aside>
            </div>
            <section id="editor-area">
                <div style="display:flex; justify-content:space-between;"><h2 style="color:#fff;">EDIT</h2><span id="char-count" style="color:#666;">0 / 10000</span></div>
                <div style="margin-bottom:10px;"><button class="btn btn-small" onclick="insertImage()">📷 画像挿入</button></div>
                <input type="text" id="e-id" placeholder="ページ名" class="chat-input">
                <input type="text" id="e-ca" placeholder="カテゴリ" class="chat-input">
                <input type="password" id="e-pass" placeholder="保存パスワード（作成時のみ必須）" class="chat-input">
                <input type="text" id="e-shared" placeholder="共同編集者のメール (カンマ区切り)" class="chat-input">
                <textarea id="e-ct"></textarea>
                <div style="display:flex; gap:10px; margin-top:10px;"><button class="btn" onclick="savePage()">保存</button><button class="btn" style="background:#444;" onclick="location.hash='#home'">戻る</button></div>
            </section>
        </div>
    </main>
</div>
<a href="javascript:openEditor()" class="fab">+</a>
</body>
</html>
